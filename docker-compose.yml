services:
  nginx:
    image: nginx:1.25-alpine
    container_name: lemp-nginx
    ports:
      - "4001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:ro
    depends_on:
      - php
    networks:
      - frontend
      - backend
    restart: unless-stopped

  php:
    image: php:8.2-fpm-alpine
    container_name: lemp-php
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql
    networks:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lemp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: lemp_user
      MYSQL_PASSWORD: lemp_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: lemp-phpmyadmin
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql
    networks:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
